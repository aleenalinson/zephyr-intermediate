# Enable the Ztest unit testing framework
CONFIG_ZTEST=y

# Increase stack size for test threads to avoid hitting limits during test execution
CONFIG_ZTEST_STACK_SIZE=4096

# Randomize suite and test order to catch ordering dependencies early
CONFIG_ZTEST_SHUFFLE=y

# Enable logging for debugging test failures
CONFIG_LOG=y

# Sensor subsystem: required to compile sensor.h types and z_impl_* helpers
CONFIG_SENSOR=y
